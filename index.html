<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Gesture Counter</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

<style>
body { font-family: Arial; text-align: center; }
#counter { font-size: 22px; margin-top: 15px; }
</style>
</head>

<body>

<h2>Кері байланыс</h2>

<div id="webcam-container"></div>
<div id="counter"></div>

<script>
const URL = "./";

let model, webcam;
let lastGesture = "";
let counts = {};

async function init() {
    model = await tmImage.load(URL + "model.json", URL + "metadata.json");

    webcam = new tmImage.Webcam(300, 300, true);
    await webcam.setup();
    await webcam.play();
    window.requestAnimationFrame(loop);

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    model.getClassLabels().forEach(label => counts[label] = 0);
}

async function loop() {
    webcam.update();
    await predict();
    requestAnimationFrame(loop);
}

async function predict() {
    const prediction = await model.predict(webcam.canvas);
    let best = prediction.reduce((a, b) =>
        a.probability > b.probability ? a : b
    );

    if (best.probability > 0.9 && best.className !== lastGesture) {
        counts[best.className]++;
        lastGesture = best.className;
    }

    let text = "";
    for (let g in counts) {
        text += `${g}: ${counts[g]}<br>`;
    }
    document.getElementById("counter").innerHTML = text;
}

init();
</script>

</body>
</html>
